<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lite 3D Mobile Driver</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Warna langit */
            touch-action: none; /* Cegah pull-to-refresh & scroll */
            user-select: none;
            -webkit-user-select: none;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        .glass {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Efek saat tombol ditekan */
        .btn-active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="w-screen h-screen relative text-white">

    <div id="game-canvas" class="absolute inset-0 z-0"></div>

    <div class="absolute top-4 left-4 right-4 z-10 flex justify-between pointer-events-none">
        <div class="glass px-4 py-2 rounded-xl flex flex-col items-center shadow-lg">
            <span class="text-[10px] text-gray-300 font-bold uppercase tracking-wider">Jarak</span>
            <div class="flex items-baseline gap-1">
                <span id="score" class="text-2xl font-black text-yellow-400">0</span>
                <span class="text-xs font-bold text-gray-300">m</span>
            </div>
        </div>
        <div class="glass px-4 py-2 rounded-xl flex flex-col items-center shadow-lg">
            <span class="text-[10px] text-gray-300 font-bold uppercase tracking-wider">Speed</span>
            <div class="flex items-baseline gap-1">
                <span id="speed" class="text-2xl font-black text-white">0</span>
                <span class="text-xs font-bold text-gray-300">km/h</span>
            </div>
        </div>
    </div>

    <!-- Kontrol Kiri (Setir) -->
    <div class="absolute bottom-6 left-4 z-10 flex gap-2">
        <button id="btn-left" class="glass w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center text-3xl font-black transition-transform select-none">
            &#10094;
        </button>
        <button id="btn-right" class="glass w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center text-3xl font-black transition-transform select-none">
            &#10095;
        </button>
    </div>

    <!-- Kontrol Kanan (Pedal) -->
    <div class="absolute bottom-6 right-4 z-10 flex gap-2">
        <button id="btn-brake" class="glass w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex flex-col items-center justify-center transition-transform select-none bg-red-900/40">
            <span class="text-xs font-bold tracking-widest uppercase text-red-200">Rem</span>
        </button>
        <button id="btn-gas" class="glass w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex flex-col items-center justify-center transition-transform select-none bg-green-900/40">
            <span class="text-xs font-bold tracking-widest uppercase text-green-200">Gas</span>
        </button>
    </div>

    <div id="screen-start" class="absolute inset-0 z-50 bg-black/80 flex flex-col items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-gray-800 p-8 rounded-3xl w-full max-w-sm text-center border border-gray-600 shadow-2xl">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500 mb-2">LITE DRIVER 3D</h1>
            <p class="text-gray-400 text-sm mb-8">Sangat ringan. Hindari kotak merah. Gunakan tombol layar atau Panah/WASD.</p>
            <button id="btn-start" class="w-full py-4 bg-green-500 hover:bg-green-400 text-black font-black text-lg rounded-xl uppercase tracking-widest active:scale-95 transition-transform">
                Mulai Mengemudi
            </button>
        </div>
    </div>

    <div id="screen-gameover" class="absolute inset-0 z-50 bg-red-900/90 hidden flex-col items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-gray-900 p-8 rounded-3xl w-full max-w-sm text-center border border-red-500 shadow-2xl">
            <h2 class="text-4xl font-black text-red-500 mb-2">TABRAKAN!</h2>
            <div class="bg-black/50 rounded-xl p-4 mb-6">
                <span class="text-sm text-gray-400 font-bold uppercase tracking-wider block mb-1">Jarak Tempuh</span>
                <span id="final-score" class="text-4xl font-black text-yellow-400">0m</span>
            </div>
            <button id="btn-restart" class="w-full py-4 bg-white hover:bg-gray-200 text-black font-black text-lg rounded-xl uppercase tracking-widest active:scale-95 transition-transform">
                Main Lagi
            </button>
        </div>
    </div>

    <script>
        // --- Game State & Config ---
        let scene, camera, renderer;
        let gameState = 'START'; // START, PLAY, GAMEOVER
        
        let score = 0;
        let speed = 0;
        let maxSpeed = 0.8; 
        let acceleration = 0.01;
        let deceleration = 0.005;
        let braking = 0.02;
        let steeringSpeed = 0.15;
        
        // Input tracking
        const keys = { gas: false, brake: false, left: false, right: false };

        // --- Objek 3D ---
        let car;
        const roadLines = [];
        const obstacles = [];
        const trees = [];
        
        // Konstanta Pooling
        const NUM_LINES = 15;
        const NUM_OBSTACLES = 5;
        const NUM_TREES = 12;
        const ROAD_WIDTH = 8;
        const DRAW_DISTANCE = 100;

        // UI Elements
        const uiScore = document.getElementById('score');
        const uiSpeed = document.getElementById('speed');
        const screenStart = document.getElementById('screen-start');
        const screenGameover = document.getElementById('screen-gameover');
        const finalScore = document.getElementById('final-score');

        function init() {
            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky Blue
            scene.fog = new THREE.Fog(0x87CEEB, 20, DRAW_DISTANCE); // Fog menutupi batas ujung dunia

            // 2. Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, DRAW_DISTANCE + 10);
            camera.position.set(0, 3, -6);
            camera.lookAt(0, 0, 5);

            // 3. Renderer (Ultra-Optimized)
            const canvas = document.getElementById('game-canvas');
            renderer = new THREE.WebGLRenderer({ 
                antialias: false, // Matikan anti-aliasing agar ringan
                powerPreference: "low-power" // Beri sinyal ke GPU HP
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            // KUNCI PERFORMA: Batasi resolusi render maksimum ke 1 (Sangat penting untuk HP)
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1)); 
            canvas.appendChild(renderer.domElement);

            // 4. Lighting (Simpel)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 10, 5);
            scene.add(dirLight);

            buildWorld();
            setupControls();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.getElementById('btn-start').addEventListener('click', startGame);
            document.getElementById('btn-restart').addEventListener('click', resetGame);

            // Mulai loop animasi
            requestAnimationFrame(gameLoop);
        }

        function buildWorld() {
            // A. Tanah Dasar (Rumput)
            const groundGeo = new THREE.PlaneGeometry(200, DRAW_DISTANCE * 2);
            // Menggunakan Lambert, lebih ringan dari Phong
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x3b823e }); 
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = DRAW_DISTANCE / 2;
            scene.add(ground);

            // B. Jalan Aspal
            const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, DRAW_DISTANCE * 2);
            const roadMat = new THREE.MeshBasicMaterial({ color: 0x333333 }); // Basic material super ringan
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.y = 0.01; // Sedikit di atas tanah untuk mencegah Z-fighting
            road.position.z = DRAW_DISTANCE / 2;
            scene.add(road);

            // C. Mobil (Kotak Sederhana)
            car = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.BoxGeometry(1.2, 0.6, 2.4);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x3b82f6 }); // Biru
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            car.add(body);
            
            // Atap / Kaca
            const topGeo = new THREE.BoxGeometry(1.0, 0.4, 1.2);
            const topMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.set(0, 1.0, -0.2);
            car.add(top);

            scene.add(car);

            // D. Garis Jalan (Object Pooling)
            const lineGeo = new THREE.PlaneGeometry(0.2, 3);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            for(let i = 0; i < NUM_LINES; i++) {
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.02, i * (DRAW_DISTANCE / NUM_LINES));
                scene.add(line);
                roadLines.push(line);
            }

            // E. Rintangan (Kotak Merah) - Object Pooling
            const obsGeo = new THREE.BoxGeometry(1.4, 1.2, 1.4);
            const obsMat = new THREE.MeshLambertMaterial({ color: 0xe11d48 }); // Merah
            for(let i = 0; i < NUM_OBSTACLES; i++) {
                const obs = new THREE.Mesh(obsGeo, obsMat);
                obs.position.y = 0.6;
                // Sebar rintangan di depan
                resetObstacle(obs, 30 + i * 25);
                scene.add(obs);
                obstacles.push(obs);
            }

            // F. Scenery/Pepohonan (Kotak Hijau di pinggir jalan)
            const treeGeo = new THREE.BoxGeometry(1, 4, 1);
            const treeMat = new THREE.MeshLambertMaterial({ color: 0x166534 });
            for(let i = 0; i < NUM_TREES; i++) {
                const tree = new THREE.Mesh(treeGeo, treeMat);
                tree.position.y = 2;
                resetTree(tree, i * (DRAW_DISTANCE / NUM_TREES));
                scene.add(tree);
                trees.push(tree);
            }
        }

        function resetObstacle(obs, zDistance) {
            // Tiga jalur acak
            const lanes = [-2.5, 0, 2.5];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            obs.position.x = lane;
            obs.position.z = zDistance;
        }

        function resetTree(tree, zDistance) {
            // Taruh di kiri atau kanan jalan secara acak
            const isLeft = Math.random() > 0.5;
            tree.position.x = isLeft ? - (ROAD_WIDTH/2 + 2 + Math.random()*5) : (ROAD_WIDTH/2 + 2 + Math.random()*5);
            tree.position.z = zDistance;
            
            // Random tinggi
            tree.scale.y = 0.8 + Math.random() * 0.5;
        }

        function setupControls() {
            // --- Helper untuk Touch (Mendukung Multi-touch) ---
            function bindBtn(id, keyStr) {
                const btn = document.getElementById(id);
                if(!btn) return;
                
                const press = (e) => {
                    e.preventDefault(); // Cegah fungsi bawaan HP
                    keys[keyStr] = true;
                    btn.classList.add('btn-active');
                };
                const release = (e) => {
                    e.preventDefault();
                    keys[keyStr] = false;
                    btn.classList.remove('btn-active');
                };

                btn.addEventListener('touchstart', press, { passive: false });
                btn.addEventListener('touchend', release, { passive: false });
                btn.addEventListener('touchcancel', release, { passive: false });
                
                // Fallback untuk klik mouse (di PC)
                btn.addEventListener('mousedown', press);
                btn.addEventListener('mouseup', release);
                btn.addEventListener('mouseleave', release);
            }

            bindBtn('btn-gas', 'gas');
            bindBtn('btn-brake', 'brake');
            bindBtn('btn-left', 'left');
            bindBtn('btn-right', 'right');

            // --- Keyboard Bindings ---
            window.addEventListener('keydown', (e) => {
                if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.gas = true;
                if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.brake = true;
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.gas = false;
                if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.brake = false;
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            });
        }

        function startGame() {
            screenStart.classList.add('hidden');
            screenStart.classList.remove('flex');
            gameState = 'PLAY';
            keys.gas = true; // Auto gas saat mulai (sesaat)
            setTimeout(() => { keys.gas = false; }, 300);
        }

        function resetGame() {
            // Reset state
            score = 0;
            speed = 0;
            car.position.x = 0;
            car.rotation.z = 0;
            car.rotation.y = 0;
            
            // Reset posisi objek pooling
            obstacles.forEach((obs, i) => resetObstacle(obs, 40 + i * 25));
            trees.forEach((tree, i) => resetTree(tree, i * (DRAW_DISTANCE / NUM_TREES)));
            
            uiScore.innerText = '0';
            uiSpeed.innerText = '0';
            
            screenGameover.classList.add('hidden');
            screenGameover.classList.remove('flex');
            gameState = 'PLAY';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            speed = 0;
            finalScore.innerText = Math.floor(score) + ' m';
            screenGameover.classList.remove('hidden');
            screenGameover.classList.add('flex');
        }

        function updateGame() {
            if (gameState !== 'PLAY') return;

            // 1. Kecepatan (Akselerasi/Deselerasi)
            if (keys.gas) {
                speed += acceleration;
                if(speed > maxSpeed) speed = maxSpeed;
            } else if (keys.brake) {
                speed -= braking;
                if(speed < 0) speed = 0;
            } else {
                speed -= deceleration; // Pelan-pelan berhenti jika dilepas
                if(speed < 0) speed = 0;
            }

            // Update UI
            score += speed * 0.5; // Tambah skor
            uiScore.innerText = Math.floor(score);
            uiSpeed.innerText = Math.floor(speed * 150); // Visual km/h

            // 2. Kontrol Setir
            let isTurning = false;
            if (keys.left && speed > 0.05) {
                car.position.x += steeringSpeed * (speed/maxSpeed + 0.2); // Belok lebih cepat jika ngebut
                car.rotation.z = Math.min(car.rotation.z + 0.05, 0.15); // Mobil miring
                car.rotation.y = Math.min(car.rotation.y + 0.05, 0.1);
                isTurning = true;
            } else if (keys.right && speed > 0.05) {
                car.position.x -= steeringSpeed * (speed/maxSpeed + 0.2);
                car.rotation.z = Math.max(car.rotation.z - 0.05, -0.15);
                car.rotation.y = Math.max(car.rotation.y - 0.05, -0.1);
                isTurning = true;
            }

            // Kembalikan posisi mobil tegak jika tidak berbelok
            if (!isTurning) {
                car.rotation.z *= 0.8;
                car.rotation.y *= 0.8;
            }

            // Batasi mobil agar tidak keluar aspal
            const maxBound = (ROAD_WIDTH / 2) - 0.6;
            if (car.position.x > maxBound) car.position.x = maxBound;
            if (car.position.x < -maxBound) car.position.x = -maxBound;

            // 3. Ilusi Bergerak (Gerakkan dunia mendekati kamera)
            if (speed > 0) {
                // Gerakkan Garis Jalan
                roadLines.forEach(line => {
                    line.position.z -= speed;
                    if (line.position.z < -2) {
                        line.position.z += DRAW_DISTANCE; // Recycle ke depan
                    }
                });

                // Gerakkan Pepohonan
                trees.forEach(tree => {
                    tree.position.z -= speed;
                    if (tree.position.z < -5) {
                        resetTree(tree, DRAW_DISTANCE);
                    }
                });

                // Gerakkan Rintangan & Cek Tabrakan
                obstacles.forEach(obs => {
                    obs.position.z -= speed;
                    
                    // Cek Tabrakan (Bounding Box Sederhana & Cepat)
                    // Jarak Z dekat, dan Jarak X dekat
                    if (obs.position.z < 2 && obs.position.z > -1) {
                        if (Math.abs(car.position.x - obs.position.x) < 1.3) {
                            gameOver();
                        }
                    }

                    // Recycle Rintangan jika lewat di belakang kamera
                    if (obs.position.z < -5) {
                        // Taruh di jarak terjauh + sedikit random agar tidak berbaris rapi
                        resetObstacle(obs, DRAW_DISTANCE + Math.random() * 20);
                    }
                });
            }
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            updateGame();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Jalankan game saat window siap
        window.onload = init;
    </script>
</body>
</html>
